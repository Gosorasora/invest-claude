[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-claude"
version = "0.1.0"
description = "멀티 에이전트 토론 기반 자동 투자 시스템 (모의 투자 / 오프라인 우선)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "invest-claude" }]
dependencies = []

[project.optional-dependencies]
# 실제 Claude LLM 사용
llm = ["anthropic>=0.40"]
# config.yaml 파싱
yaml = ["pyyaml>=6.0"]
# 보기 좋은 터미널 출력
rich = ["rich>=13.0"]
# 테스트
test = ["pytest>=7.0"]
all = ["anthropic>=0.40", "pyyaml>=6.0", "rich>=13.0", "pytest>=7.0"]

[project.scripts]
invest-claude = "invest_claude.cli:main"

[tool.setuptools]
packages = ["invest_claude", "invest_claude.agents", "invest_claude.market", "invest_claude.broker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
